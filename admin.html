<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOYZ Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F5F3;
    --panel:#FFFFFF;
    --border:#E2E5E1;
    --ink:#1B231F;
    --muted:#6E786F;
    --teal:#1F5F52;
    --teal-deep:#153F37;
    --teal-wash:#EAF2EF;
    --red:#D6472F;
    --red-wash:#FBEAE6;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px; background:linear-gradient(145deg,#F4F5F3,#EAF2EF); }
  .login-screen.hidden{ display:none; }
  .login-card{ width:min(420px,100%); background:#fff; border:1px solid var(--border); border-radius:22px; padding:34px; box-shadow:0 24px 65px -34px rgba(20,35,29,.48); }
  .login-brand{ display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:27px; font-size:27px; font-weight:800; }
  .login-brand-pill{ display:inline-flex; align-items:center; gap:9px; padding:8px 16px 8px 10px; border:4px solid #F45155; border-radius:999px; background:#17171D; color:#fff; letter-spacing:1px; }
  .login-brand-dot{ width:27px; height:27px; border-radius:50%; background:#F45155; border:7px solid #452126; }
  .login-title{ margin:0 0 6px; font:600 27px 'Fraunces',serif; }
  .login-sub{ margin:0 0 23px; color:var(--muted); font-size:13px; }
  .login-label{ display:block; margin:14px 0 7px; font-size:12px; font-weight:700; }
  .login-input{ width:100%; height:44px; border:1.5px solid var(--border); border-radius:11px; padding:0 13px; font:14px 'Inter',sans-serif; outline:none; }
  .login-input:focus{ border-color:#8FB9AC; box-shadow:0 0 0 3px rgba(143,185,172,.2); }
  .login-submit{ width:100%; justify-content:center; margin-top:22px; height:44px; background:var(--teal); border-color:var(--teal); color:#fff; }
  .login-error{ min-height:18px; margin-top:12px; color:var(--red); font-size:12px; }
  .btn{ min-height:38px; border:1.5px solid var(--border); border-radius:10px; background:#fff; color:var(--ink); padding:0 14px; display:inline-flex; align-items:center; justify-content:center; gap:7px; font:700 13px 'Inter',sans-serif; cursor:pointer; transition:background .12s ease, border-color .12s ease, transform .1s ease; }
  .btn:hover{ background:#F6F7F5; }
  .btn:active{ transform:scale(.97); }
  .app{ display:none; height:100vh; min-height:0; overflow:hidden; }
  .app.authenticated{ display:grid; grid-template-columns:296px minmax(0,1fr) 76px; }
  .sidebar{ background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:20px 16px; min-width:0; min-height:0; overflow:hidden; }
  .admin-brand{ height:58px; display:flex; align-items:center; gap:12px; margin-bottom:24px; }
  .admin-brand-pill{ height:58px; border:3px solid #F45155; border-radius:999px; background:#17171D; color:#fff; display:flex; align-items:center; justify-content:center; gap:11px; padding:0 18px 0 14px; font-weight:800; font-size:24px; letter-spacing:1.1px; }
  .admin-brand-dot{ width:30px; height:30px; border-radius:50%; background:#F45155; border:8px solid #452126; }
  .admin-brand-word{ font-size:24px; font-weight:800; color:var(--ink); letter-spacing:0; }
  .sidebar-section-label{ color:#7C847C; font-weight:800; font-size:11px; letter-spacing:.09em; text-transform:uppercase; margin:10px 4px 12px; }
  .sidebar .visit-toggle{ height:44px; margin:0 4px 16px; justify-content:center; }
  .sidebar .visit-toggle-btn{ height:34px; flex:1; font-size:13px; }
  .entry-list{ flex:1; min-height:0; display:flex; flex-direction:column; gap:8px; overflow:auto; overscroll-behavior:contain; padding-right:2px; }
  .entry{ position:relative; width:100%; border:1px solid transparent; background:transparent; border-radius:12px; padding:12px 38px 12px 12px; display:flex; align-items:center; gap:12px; cursor:pointer; text-align:left; color:var(--ink); }
  .entry:hover{ background:#F6F8F6; }
  .entry.uncopied{ background:var(--red-wash); border-color:#F3B3A9; color:#DB412D; }
  .entry.active{ background:var(--teal-wash); border-color:rgba(31,95,82,.35); color:var(--teal-deep); }
  .entry-avatar{ width:36px; height:36px; border-radius:50%; background:#E9F2EE; color:var(--teal); display:grid; place-items:center; font:800 14px 'IBM Plex Mono',monospace; flex:0 0 auto; }
  .entry.uncopied .entry-avatar{ background:#DE4D37; color:#fff; }
  .entry.active .entry-avatar{ background:var(--teal); color:#fff; }
  .entry-text{ min-width:0; flex:1; }
  .entry-owner{ position:absolute; right:9px; top:50%; transform:translateY(-50%); color:rgba(31,95,82,.76); font:800 10.5px 'IBM Plex Mono',monospace; }
  .entry.active .entry-owner{ color:var(--teal-deep); }
  .entry.uncopied .entry-owner{ color:rgba(219,65,45,.78); }
  .entry-name{ font-weight:800; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .entry-meta{ color:var(--muted); font:700 11px 'IBM Plex Mono',monospace; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .main{ min-width:0; min-height:0; overflow:hidden; display:flex; flex-direction:column; background:#fff; }
  .main-topbar{ height:64px; min-height:64px; display:flex; align-items:center; gap:12px; padding:0 20px; border-bottom:1px solid var(--border); background:#fff; }
  .topbar-title{ font-weight:800; min-width:170px; }
  .topbar-meta{ color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .spacer{ flex:1; }
  .user-email{ display:none; }
  .visit-toggle{ height:38px; display:flex; align-items:center; gap:4px; padding:4px; border:1px solid #D8E1E7; border-radius:10px; background:#fff; flex-shrink:0; }
  .visit-toggle-btn{ height:28px; min-width:38px; border:0; border-radius:7px; background:transparent; color:var(--muted); font:800 12px 'Inter',sans-serif; cursor:pointer; }
  .visit-toggle-btn.active{ background:var(--teal); color:#fff; }
  .date-nav{ display:flex; align-items:center; gap:7px; flex-shrink:0; }
  .date-step,.date-today{ height:38px; border:1px solid var(--border); border-radius:10px; background:#EEF3F7; color:#263444; cursor:pointer; font-weight:800; }
  .date-step{ width:38px; font-size:23px; line-height:1; }
  .date-today{ padding:0 13px; background:var(--teal); border-color:var(--teal-deep); color:#fff; font-size:13px; box-shadow:0 4px 10px -6px var(--teal-deep); }
  .date-input{ height:38px; width:142px; border:1px solid #D8E1E7; border-radius:10px; background:#fff; color:#17212B; padding:0 10px; font:700 13px 'Inter',sans-serif; }
  .copy-btn{ border-color:rgba(31,95,82,0.3); color:var(--teal-deep); }
  .copy-btn:hover{ background:var(--teal-wash); }
  .copy-btn.copied{ background:var(--teal); color:#fff; border-color:var(--teal); }
  .print-btn{ border-color:rgba(31,95,82,0.3); color:var(--teal-deep); }
  .print-btn:hover{ background:var(--teal-wash); }
  .discharge-btn{
    border-color:#E5B45F;
    background:#FFF6E6;
    color:#8A5200;
  }
  .discharge-btn:hover{ background:#FFE9BE; border-color:#D49B35; }
  .discharge-btn.discharged{
    background:var(--teal-wash);
    color:var(--teal-deep);
    border-color:rgba(31,95,82,.28);
  }
  .discharge-btn.discharged:hover{ background:#D7ECE4; border-color:rgba(31,95,82,.38); }
  .admin-settings{ position:relative; flex-shrink:0; }
  .settings-menu{ position:absolute; top:calc(100% + 8px); right:0; width:154px; background:#fff; border:1px solid var(--border); border-radius:12px; box-shadow:0 18px 38px -24px rgba(20,35,29,.45); padding:6px; display:none; z-index:20; }
  .settings-menu.open{ display:block; }
  .settings-item{ width:100%; border:0; background:transparent; border-radius:9px; padding:10px 12px; text-align:left; font:700 13px 'Inter',sans-serif; color:var(--ink); cursor:pointer; }
  .settings-item:hover{ background:#F6F8F6; }
  .main-scroll{ flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:36px 42px 80px; }
  .note-title{ margin:0 0 20px; font:600 31px 'Fraunces',serif; }
  .note-editor{ width:100%; min-height:calc(100vh - 190px); border:0; outline:none; resize:vertical; background:#fff; color:#26302B; font:16px/1.55 'Inter',system-ui,sans-serif; padding:0; white-space:pre-wrap; }
  .note-editor p{ margin:0 0 10px; }
  .note-editor strong{ font-weight:800; color:#1E2521; }
  .empty-state{ height:100%; display:flex; align-items:center; justify-content:center; flex-direction:column; color:var(--muted); text-align:center; padding:32px; }
  .empty-title{ font:600 30px 'Fraunces',serif; color:#1E2521; margin-bottom:8px; }
  .user-rail{ width:76px; min-height:0; border-left:1px solid var(--border); background:#FAFBF9; display:flex; flex-direction:column; align-items:center; padding:14px 8px; gap:8px; overflow:auto; overscroll-behavior:contain; }
  .rail-label{ color:#7C847C; font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; margin:4px 0 8px; }
  .user-pill{ width:54px; min-height:38px; border:1px solid var(--teal); border-radius:12px; background:var(--teal); color:#fff; font:800 12px 'Inter',sans-serif; cursor:pointer; }
  .user-pill:hover{ background:var(--teal-deep); border-color:var(--teal-deep); }
  .user-pill.pending{ background:var(--red); border-color:var(--red); }
  .user-pill.pending:hover{ background:#B93B28; border-color:#B93B28; }
  .user-pill.active{ box-shadow:0 0 0 3px rgba(31,95,82,.18); }
  .blocked{ color:var(--red); background:var(--red-wash); border:1px solid #F3B3A9; border-radius:12px; padding:14px; font-size:13px; }
  .modal{ position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center; padding:22px; background:rgba(20,27,24,.34); }
  .modal.open{ display:flex; }
  .modal-card{ width:min(760px,100%); max-height:min(82vh,760px); overflow:auto; background:#fff; border:1px solid var(--border); border-radius:18px; box-shadow:0 26px 74px -34px rgba(15,24,21,.55); padding:24px; }
  .modal-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; }
  .modal-title{ margin:0 0 5px; font:600 27px 'Fraunces',serif; }
  .modal-sub{ margin:0; color:var(--muted); font-size:13px; }
  .modal-close{ width:36px; height:36px; border:1px solid var(--border); border-radius:10px; background:#fff; cursor:pointer; font-size:22px; line-height:1; }
  .mapping-row{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; margin-bottom:14px; }
  .mapping-input{ height:40px; border:1.5px solid var(--border); border-radius:10px; padding:0 12px; font:14px 'Inter',sans-serif; outline:none; }
  .mapping-input:focus{ border-color:#8FB9AC; box-shadow:0 0 0 3px rgba(143,185,172,.2); }
  .mapping-users{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:8px; margin:10px 0 18px; }
  .mapping-user{ display:flex; align-items:center; gap:9px; border:1px solid var(--border); border-radius:10px; padding:10px; font-size:13px; color:var(--ink); }
  .mapping-user span{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mapping-groups{ display:flex; flex-direction:column; gap:8px; border-top:1px solid var(--border); padding-top:14px; }
  .mapping-group{ display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:12px; border:1px solid var(--border); border-radius:12px; padding:11px 12px; }
  .mapping-group-title{ font-weight:800; }
  .mapping-group-members{ color:var(--muted); font-size:12px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .danger-btn{ color:var(--red); border-color:#F3B3A9; }
  @media (max-width:900px){
    .app.authenticated{ grid-template-columns:240px 1fr 66px; }
    .sidebar{ padding:16px 12px; }
    .main-scroll{ padding:26px 24px 70px; }
    .user-rail{ width:66px; }
    .user-pill{ width:48px; }
  }
</style>
</head>
<body>
<section class="login-screen" id="loginScreen">
  <form class="login-card" id="loginForm">
    <div class="login-brand"><span class="login-brand-pill"><span class="login-brand-dot"></span>WOYZ</span><span>Admin</span></div>
    <h1 class="login-title">Sign in</h1>
    <p class="login-sub">Admin access is restricted to the configured Firebase UID.</p>
    <label class="login-label" for="loginEmail">Email address</label>
    <input class="login-input" id="loginEmail" type="email" autocomplete="username" required>
    <label class="login-label" for="loginPassword">Password</label>
    <input class="login-input" id="loginPassword" type="password" autocomplete="current-password" required>
    <button class="btn login-submit" id="loginSubmit" type="submit">Sign in</button>
    <div class="login-error" id="loginError" role="alert"></div>
  </form>
</section>

<div class="app" id="appShell">
  <aside class="sidebar">
    <div class="admin-brand"><span class="admin-brand-pill"><span class="admin-brand-dot"></span><span>WOYZ</span></span><span class="admin-brand-word">Notes</span></div>
    <div class="visit-toggle" id="adminVisitToggle" aria-label="Visit type">
      <button class="visit-toggle-btn active" data-admin-visit-type="OP">OP</button>
      <button class="visit-toggle-btn" data-admin-visit-type="IP">IP</button>
    </div>
    <div class="sidebar-section-label" id="notesLabel">Notes</div>
    <div class="entry-list" id="entryList"></div>
  </aside>
  <main class="main">
    <div class="main-topbar">
      <div>
        <div class="topbar-title" id="topbarTitle">Admin notes</div>
        <div class="topbar-meta" id="topbarMeta">Select a user</div>
      </div>
      <div class="spacer"></div>
      <div class="user-email" id="userEmail"></div>
      <div class="date-nav" id="adminDateNav" aria-label="Visit date navigation">
        <button class="date-step" id="adminPreviousDateBtn" aria-label="Previous day">&lsaquo;</button>
        <input class="date-input" id="adminVisitDateInput" type="date" aria-label="Visit date">
        <button class="date-step" id="adminNextDateBtn" aria-label="Next day">&rsaquo;</button>
        <button class="date-today" id="adminTodayBtn" title="Jump to today"></button>
      </div>
      <button class="btn copy-btn" id="saveNoteBtn" style="display:none;">Save</button>
      <button class="btn discharge-btn" id="dischargeBtn" style="display:none;">Discharge</button>
      <button class="btn copy-btn" id="copyBtn" style="display:none;">Copy note</button>
      <button class="btn print-btn" id="printBtn" style="display:none;" aria-label="Print visit note" title="Print visit note">Print</button>
      <div class="admin-settings">
        <button class="btn" id="adminSettingsBtn" aria-expanded="false">Settings</button>
        <div class="settings-menu" id="adminSettingsMenu">
          <button class="settings-item" id="mappingBtn" type="button">Mapping</button>
          <button class="settings-item" id="signoutBtn" type="button">Sign out</button>
        </div>
      </div>
    </div>
    <div class="main-scroll" id="mainScroll"></div>
  </main>
  <nav class="user-rail" id="userRail" aria-label="Users">
    <div class="rail-label">Users</div>
  </nav>
</div>

<div class="modal" id="mappingModal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="mappingTitle">
    <div class="modal-head">
      <div>
        <h2 class="modal-title" id="mappingTitle">Mapping</h2>
        <p class="modal-sub">Create groups so selected users can see and edit each other's OP and IP notes. Delete remains owner-only.</p>
      </div>
      <button class="modal-close" id="mappingCloseBtn" type="button" aria-label="Close mapping">&times;</button>
    </div>
    <div class="mapping-row">
      <input class="mapping-input" id="mappingGroupName" type="text" placeholder="Group name">
      <button class="btn copy-btn" id="saveMappingBtn" type="button">Create group</button>
    </div>
    <div class="mapping-users" id="mappingUserList"></div>
    <div class="mapping-groups" id="mappingGroupsList"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';

import { firebaseConfig } from './firebase-config.js';

const ADMIN_UID = 'th8Jr2dzCdbBaKQYST1MzQZDG4G3';

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginScreen = document.getElementById('loginScreen');
const loginForm = document.getElementById('loginForm');
const loginEmail = document.getElementById('loginEmail');
const loginPassword = document.getElementById('loginPassword');
const loginSubmit = document.getElementById('loginSubmit');
const loginError = document.getElementById('loginError');
const appShell = document.getElementById('appShell');
const entryList = document.getElementById('entryList');
const userRail = document.getElementById('userRail');
const mainScroll = document.getElementById('mainScroll');
const topbarTitle = document.getElementById('topbarTitle');
const topbarMeta = document.getElementById('topbarMeta');
const userEmail = document.getElementById('userEmail');
const adminVisitToggle = document.getElementById('adminVisitToggle');
const adminPreviousDateBtn = document.getElementById('adminPreviousDateBtn');
const adminNextDateBtn = document.getElementById('adminNextDateBtn');
const adminVisitDateInput = document.getElementById('adminVisitDateInput');
const adminTodayBtn = document.getElementById('adminTodayBtn');
const saveNoteBtn = document.getElementById('saveNoteBtn');
const dischargeBtn = document.getElementById('dischargeBtn');

const printBtn = document.getElementById('printBtn');
const adminSettingsBtn = document.getElementById('adminSettingsBtn');
const adminSettingsMenu = document.getElementById('adminSettingsMenu');
const mappingBtn = document.getElementById('mappingBtn');
const signoutBtn = document.getElementById('signoutBtn');
const notesLabel = document.getElementById('notesLabel');
const mappingModal = document.getElementById('mappingModal');
const mappingCloseBtn = document.getElementById('mappingCloseBtn');
const mappingGroupName = document.getElementById('mappingGroupName');
const mappingUserList = document.getElementById('mappingUserList');
const mappingGroupsList = document.getElementById('mappingGroupsList');
const saveMappingBtn = document.getElementById('saveMappingBtn');

let notesUnsubscribe = null;
let profilesUnsubscribe = null;
let groupsUnsubscribe = null;
let allNotes = [];
let userProfiles = {};
let allGroups = [];
let users = [];
let selectedUserId = null;
let selectedNoteId = null;

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
}

function compactNoteText(text){
  return String(text || '')
    .replace(/\r\n/g, '\n')
    .replace(/^(Patient Name:\s*[^\n]+)\n(Age:\s*[^\n]+)\n(UHID:\s*[^\n]+)\n(Sex:\s*[^\n]+)/im, '$1 · $2 · $3 · $4')
    .split(/\n{2,}/)
    .map(block => {
      const lines = block.split('\n').map(line => line.trim()).filter(Boolean);
      if (!lines.length) return '';
      if (lines.length > 1 && /:$/.test(lines[0])) return `${lines[0]} ${lines.slice(1).join(' ')}`;
      return lines.join('\n');
    })
    .filter(Boolean)
    .join('\n\n');
}

function richNoteHtml(text){
  return String(text || '')
    .replace(/\r\n/g, '\n')
    .split('\n')
    .map(line => {
      const escaped = escapeHtml(line);
      return escaped.replace(/^([^:<\n]{2,90}:)(\s*)/, '<strong>$1</strong>$2');
    })
    .join('<br>');
}

function editorPlainText(editor){
  return editor?.value ?? editor?.innerText ?? '';
}

function initials(value){
  return String(value || 'N').split(' ').filter(Boolean).slice(0,2).map(part => part[0]).join('').toUpperCase();
}

function twoLetterCode(value, fallback){
  const label = String(value || fallback || 'NA').trim();
  const parts = label.split(/\s+/).filter(Boolean);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return label.replace(/[^a-z0-9]/gi,'').slice(0,2).toUpperCase().padEnd(2,'N');
}

function noteOwnerCode(note, fallback){
  const credential = userProfiles[note.userId]?.credentialName || fallback || '';
  return twoLetterCode(credential, initials(notePatientName(note)));
}

function isNilLike(value){
  return /^(nil|none|no|not applicable|n\/a|na|negative)$/i.test(String(value || '').trim());
}

function cleanAge(value){
  const text = String(value || '').trim();
  if (!text || /^nil$/i.test(text)) return 'NIL';
  const number = text.match(/\d+(?:\.\d+)?/)?.[0];
  return number || text.replace(/\b(years?|yrs?|old)\b/gi, '').trim() || 'NIL';
}

function compactSex(value){
  const text = String(value || '').trim() || 'NIL';
  if (/^f(emale)?\b/i.test(text)) return 'F';
  if (/^m(ale)?\b/i.test(text)) return 'M';
  return text;
}

function compactPatientMetaText(value){
  return String(value || '')
    .replace(/\bFemale\b/gi, 'F')
    .replace(/\bMale\b/gi, 'M')
    .replace(/\b(\d+(?:\.\d+)?)\s*(?:years?|yrs?|old)\b/gi, '$1');
}

function removeNilSectionsForCopy(text){
  const protectedInlineLabels = new Set(['patient name','age','uhid']);
  return String(text || '')
    .replace(/\r\n/g, '\n')
    .split(/\n{2,}/)
    .map(block => block.trim())
    .map(block => {
      const lines = block.split('\n').map(line => line.trim()).filter(Boolean);
      if (!lines.length) return '';
      if (lines.length === 1){
        const inlineMatch = lines[0].match(/^([^:]+):\s*(.*)$/);
        if (!inlineMatch) return lines[0];
        const label = inlineMatch[1].trim().toLowerCase();
        return protectedInlineLabels.has(label) || !isNilLike(inlineMatch[2]) ? lines[0] : '';
      }
      if (/:$/.test(lines[0]) && isNilLike(lines.slice(1).join(' '))) return '';
      return lines.filter(line => {
        const inlineMatch = line.match(/^([^:]+):\s*(.*)$/);
        if (!inlineMatch) return true;
        const label = inlineMatch[1].trim().toLowerCase();
        return protectedInlineLabels.has(label) || !isNilLike(inlineMatch[2]);
      }).join('\n');
    })
    .filter(Boolean)
    .join('\n\n')
    .trim();
}

function notePatientName(note){
  const name = note.data.patientData?.name;
  return name && name !== 'NIL' ? name : 'Untitled note';
}

function noteVisitType(note){
  return note.data?.visitType === 'IP' ? 'IP' : 'OP';
}

function noteMatchesSelectedScope(note, selectedDate = dateInputValue(selectedVisitDate)){
  if (noteVisitType(note) !== selectedVisitType) return false;
  if (selectedVisitType !== 'IP') return note.data?.visitDate === selectedDate;
  const admissionDate = note.data?.admissionDate || note.data?.visitDate || selectedDate;
  const dischargeDate = note.data?.dischargeDate || null;
  if (admissionDate > selectedDate) return false;
  return !dischargeDate || dischargeDate >= selectedDate;
}

function canToggleDischargeNote(note){
  return Boolean(note?.path && noteVisitType(note) === 'IP');
}

function updateDischargeButton(note){
  const canToggle = canToggleDischargeNote(note);
  const isDischarged = Boolean(note?.data?.dischargeDate);
  dischargeBtn.style.display = canToggle ? 'inline-flex' : 'none';
  dischargeBtn.classList.toggle('discharged', canToggle && isDischarged);
  dischargeBtn.textContent = isDischarged ? 'Discharged' : 'Discharge';
  dischargeBtn.setAttribute('aria-label', isDischarged ? 'Revert IP discharge' : 'Discharge IP patient');
  dischargeBtn.title = isDischarged ? 'Revert IP discharge' : 'Discharge IP patient';
}

function dateInputValue(date){
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function updateDateNavigation(){
  adminVisitDateInput.value = dateInputValue(selectedVisitDate);
  adminTodayBtn.textContent = new Date().toLocaleDateString('en-US',{weekday:'long'});
}

function latestDateForSelectedType(){
  return allNotes
    .filter(note => noteVisitType(note) === selectedVisitType)
    .map(note => note.data?.visitDate)
    .filter(Boolean)
    .sort()
    .pop() || null;
}

function setSelectedVisitDateFromValue(value){
  const [year,month,day] = String(value || '').split('-').map(Number);
  if (year && month && day) selectedVisitDate = new Date(year,month-1,day);
}

function moveAdminDate(days){
  adminDateTouched = true;
  const next = new Date(selectedVisitDate);
  next.setDate(next.getDate() + days);
  selectedVisitDate = next;
  selectedUserId = null;
  selectedNoteId = null;
  updateDateNavigation();
  render();
}

function visibleNotes(){
  const selectedDate = dateInputValue(selectedVisitDate);
  return allNotes.filter(note => noteMatchesSelectedScope(note, selectedDate));
}

function updateVisitToggle(){
  adminVisitToggle.querySelectorAll('[data-admin-visit-type]').forEach(button => {
    button.classList.toggle('active', button.dataset.adminVisitType === selectedVisitType);
  });
}

function noteMeta(note){
  const patient = note.data.patientData || {};
  const pieces = [noteVisitType(note)];
  if (patient.uhid) pieces.push(`UHID ${patient.uhid}`);
  if (patient.sex) pieces.push(compactSex(patient.sex));
  if (patient.age) pieces.push(cleanAge(patient.age));
  if (note.data.visitDate) pieces.push(note.data.visitDate);
  return compactPatientMetaText(pieces.join(' · ') || note.userLabel);
}

function noteTime(note){
  return note.data.updatedAt?.toMillis?.()
    || note.data.createdAt?.toMillis?.()
    || note.data.createdAtValue?.toMillis?.()
    || 0;
}

function isSavedNote(note){
  return note.data?.isDraft === false || note.data?.everSaved === true;
}

function hasUncopiedSavedNotes(userId){
  return visibleNotes().some(note => note.userId === userId && isSavedNote(note) && !note.data.adminCopiedAt);
}

function userLabel(userId, index){
  return userProfiles[userId]?.credentialName || `User ${index + 1}`;
}

function allKnownUsers(){
  const ids = new Set([...Object.keys(userProfiles), ...allNotes.map(note => note.userId)]);
  return Array.from(ids)
    .filter(uid => uid && uid !== 'unknown' && uid !== ADMIN_UID)
    .sort()
    .map((uid, index) => ({uid, label:userLabel(uid, index)}));
}

function groupMemberLabels(memberUids = []){
  return memberUids.map(uid => userProfiles[uid]?.credentialName || uid.slice(0, 8)).join(', ');
}

function renderMapping(){
  const knownUsers = allKnownUsers();
  mappingUserList.innerHTML = knownUsers.length
    ? knownUsers.map(user => `
      <label class="mapping-user">
        <input type="checkbox" value="${escapeHtml(user.uid)}">
        <span>${escapeHtml(user.label)}</span>
      </label>
    `).join('')
    : '<div class="empty-sub">No users available yet.</div>';
  mappingGroupsList.innerHTML = allGroups.length
    ? allGroups.map(group => `
      <div class="mapping-group">
        <div>
          <div class="mapping-group-title">${escapeHtml(group.name)}</div>
          <div class="mapping-group-members">${escapeHtml(groupMemberLabels(group.memberUids))}</div>
        </div>
        <button class="btn danger-btn" data-delete-group="${escapeHtml(group.id)}" type="button">Remove</button>
      </div>
    `).join('')
    : '<div class="empty-sub">No mapping groups created.</div>';
}

function closeAdminSettings(){
  adminSettingsMenu.classList.remove('open');
  adminSettingsBtn.setAttribute('aria-expanded','false');
}

function openMapping(){
  closeAdminSettings();
  renderMapping();
  mappingModal.classList.add('open');
  mappingModal.setAttribute('aria-hidden','false');
  setTimeout(() => mappingGroupName.focus(), 0);
}

function closeMapping(){
  mappingModal.classList.remove('open');
  mappingModal.setAttribute('aria-hidden','true');
  mappingGroupName.value = '';
}

async function syncUserMappings(){
  const groupsSnapshot = await getDocs(collection(db,'groups'));
  const groups = groupsSnapshot.docs.map(groupDoc => ({id:groupDoc.id, ...groupDoc.data()}));
  const knownUsers = allKnownUsers();
  await Promise.all(knownUsers.map(user => {
    const memberGroups = groups.filter(group => (group.memberUids || []).includes(user.uid));
    const sharedWith = Array.from(new Set(memberGroups.flatMap(group => group.memberUids || []).filter(uid => uid !== user.uid)));
    const groupIds = memberGroups.map(group => group.id);
    return setDoc(doc(db,'users',user.uid),{
      groupIds,
      sharedWith,
      mappingUpdatedAt:serverTimestamp(),
      mappingUpdatedBy:ADMIN_UID
    },{merge:true});
  }));
}

function showEmpty(title, message){
  copyBtn.style.display = 'none';
  printBtn.style.display = 'none';
  saveNoteBtn.style.display = 'none';
  dischargeBtn.style.display = 'none';
  mainScroll.innerHTML = `<div class="empty-state"><div class="empty-title">${escapeHtml(title)}</div><div>${escapeHtml(message)}</div></div>`;
}

function renderUsers(){
  userRail.querySelectorAll('.user-pill').forEach(button => button.remove());
  users.forEach((user, index) => {
    const button = document.createElement('button');
    button.className = [
      'user-pill',
      hasUncopiedSavedNotes(user.uid) ? 'pending' : '',
      user.uid === selectedUserId ? 'active' : ''
    ].filter(Boolean).join(' ');
    button.textContent = twoLetterCode(user.label, `U${index + 1}`);
    button.title = user.label;
    button.addEventListener('click', () => {
      selectedUserId = user.uid;
      selectedNoteId = null;
      render();
    });
    userRail.appendChild(button);
  });
}

function renderEntries(){
  entryList.innerHTML = '';
  const selectedUser = users.find(user => user.uid === selectedUserId);
  const notes = visibleNotes().filter(note => note.userId === selectedUserId);
  notesLabel.textContent = selectedUser ? selectedUser.label : 'Notes';
  notes.forEach((note, index) => {
    const button = document.createElement('button');
    const serialNumber = notes.length - index;
    button.className = [
      'entry',
      isSavedNote(note) && !note.data.adminCopiedAt ? 'uncopied' : '',
      note.id === selectedNoteId ? 'active' : ''
    ].filter(Boolean).join(' ');
    button.innerHTML = `
      <span class="entry-avatar">${escapeHtml(serialNumber)}</span>
      <span class="entry-text">
        <div class="entry-name">${escapeHtml(notePatientName(note))}</div>
        <div class="entry-meta">${escapeHtml(noteMeta(note))}</div>
      </span>
      <span class="entry-owner">${escapeHtml(noteOwnerCode(note, selectedUser?.label))}</span>
    `;
    button.addEventListener('click', () => {
      selectedNoteId = note.id;
      render();
    });
    entryList.appendChild(button);
  });
}

function renderSelectedNote(){
  const selectedUser = users.find(user => user.uid === selectedUserId);
  const notes = visibleNotes().filter(note => note.userId === selectedUserId);
  const note = notes.find(item => item.id === selectedNoteId);
  topbarTitle.textContent = selectedUser ? selectedUser.label : 'Admin notes';
  topbarMeta.textContent = selectedUser ? `${selectedVisitType} · ${notes.length} note${notes.length === 1 ? '' : 's'}` : `Select a user · ${selectedVisitType}`;
  if (!selectedUser){
    showEmpty('No users yet', 'Notes will appear here after users save them.');
    return;
  }
  if (!notes.length){
    showEmpty('No notes', `${selectedUser.label} has no notes yet.`);
    return;
  }
  if (!note){
    selectedNoteId = notes[0].id;
    renderSelectedNote();
    return;
  }
  const title = note.data.selectedMode || note.data.heading || 'Saved note';
  const text = note.data.transcription || '';
  copyBtn.style.display = text ? 'inline-flex' : 'none';
  printBtn.style.display = text ? 'inline-flex' : 'none';
  saveNoteBtn.style.display = 'inline-flex';
  updateDischargeButton(note);
  saveNoteBtn.textContent = 'Save';
  saveNoteBtn.classList.remove('copied');
  copyBtn.classList.remove('copied');
  copyBtn.textContent = 'Copy note';
  mainScroll.innerHTML = `
    <h1 class="note-title">${escapeHtml(title)}</h1>
    <div class="note-editor" id="adminNoteEditor" contenteditable="true" role="textbox" aria-label="Editable admin note">${richNoteHtml(text)}</div>
  `;
}

function render(){
  if (!adminDateTouched){
    const latestDate = latestDateForSelectedType();
    if (latestDate){
      setSelectedVisitDateFromValue(latestDate);
      updateDateNavigation();
    }
  }
  const notes = visibleNotes();
  const userIds = Array.from(new Set(notes.map(note => note.userId))).sort();
  users = userIds.map((uid, index) => ({uid, label:userLabel(uid, index)}));
  if (!selectedUserId || !userIds.includes(selectedUserId)){
    selectedUserId = userIds[0] || null;
    selectedNoteId = null;
  }
  allNotes.sort((a,b) => noteTime(b) - noteTime(a));
  renderUsers();
  renderEntries();
  renderSelectedNote();
}

function subscribeToAllNotes(){
  if (notesUnsubscribe) notesUnsubscribe();
  notesUnsubscribe = onSnapshot(collectionGroup(db,'notes'), snapshot => {
    allNotes = snapshot.docs.map(doc => {
      const userId = doc.ref.parent.parent?.id || 'unknown';
      return {
        id:doc.id,
        path:doc.ref.path,
        userId,
        userLabel:'',
        data:doc.data()
      };
    });
    render();
  }, error => {
    console.error(error);
    showEmpty('Unable to load notes', error.message || 'Check admin permissions and Firestore rules.');
  });
}

function subscribeToUserProfiles(){
  if (profilesUnsubscribe) profilesUnsubscribe();
  profilesUnsubscribe = onSnapshot(collection(db,'users'), snapshot => {
    userProfiles = Object.fromEntries(snapshot.docs.map(doc => [doc.id, doc.data()]));
    render();
    renderMapping();
  }, error => {
    console.error(error);
  });
}

function subscribeToGroups(){
  if (groupsUnsubscribe) groupsUnsubscribe();
  groupsUnsubscribe = onSnapshot(collection(db,'groups'), snapshot => {
    allGroups = snapshot.docs.map(groupDoc => ({id:groupDoc.id, ...groupDoc.data()}));
    renderMapping();
  }, error => {
    console.error(error);
  });
}

loginForm.addEventListener('submit', async event => {
  event.preventDefault();
  loginError.textContent = '';
  loginSubmit.disabled = true;
  loginSubmit.textContent = 'Signing in...';
  try{
    await signInWithEmailAndPassword(auth, loginEmail.value.trim(), loginPassword.value);
    loginPassword.value = '';
  }catch(error){
    loginError.textContent = 'Unable to sign in. Check the email and password.';
  }finally{
    loginSubmit.disabled = false;
    loginSubmit.textContent = 'Sign in';
  }
});

onAuthStateChanged(auth, user => {
  if (notesUnsubscribe) notesUnsubscribe();
  if (profilesUnsubscribe) profilesUnsubscribe();
  if (groupsUnsubscribe) groupsUnsubscribe();
  notesUnsubscribe = null;
  profilesUnsubscribe = null;
  groupsUnsubscribe = null;
  allNotes = [];
  userProfiles = {};
  allGroups = [];
  selectedUserId = null;
  selectedNoteId = null;
  if (!user){
    appShell.classList.remove('authenticated');
    loginScreen.classList.remove('hidden');
    userEmail.textContent = '';
    return;
  }
  if (user.uid !== ADMIN_UID){
    appShell.classList.remove('authenticated');
    loginScreen.classList.remove('hidden');
    userEmail.textContent = '';
    loginError.innerHTML = `<div class="blocked">This account is not authorized for admin access.</div>`;
    signOut(auth);
    return;
  }
  loginScreen.classList.add('hidden');
  appShell.classList.add('authenticated');
  userEmail.textContent = '';
  updateDateNavigation();
  subscribeToUserProfiles();
  subscribeToGroups();
  subscribeToAllNotes();
});

adminPreviousDateBtn.addEventListener('click', () => moveAdminDate(-1));
adminNextDateBtn.addEventListener('click', () => moveAdminDate(1));
adminTodayBtn.addEventListener('click', () => {
  adminDateTouched = true;
  selectedVisitDate = new Date();
  selectedUserId = null;
  selectedNoteId = null;
  updateDateNavigation();
  render();
});
adminVisitDateInput.addEventListener('change', () => {
  adminDateTouched = true;
  setSelectedVisitDateFromValue(adminVisitDateInput.value);
  selectedUserId = null;
  selectedNoteId = null;
  updateDateNavigation();
  render();
});

adminVisitToggle.addEventListener('click', event => {
  const button = event.target.closest('[data-admin-visit-type]');
  if (!button) return;
  selectedVisitType = button.dataset.adminVisitType === 'IP' ? 'IP' : 'OP';
  adminDateTouched = false;
  selectedUserId = null;
  selectedNoteId = null;
  updateVisitToggle();
  render();
});
updateVisitToggle();

copyBtn.addEventListener('click', async () => {
  const note = allNotes.find(item => item.id === selectedNoteId && item.userId === selectedUserId);
  const editor = document.getElementById('adminNoteEditor');
  const text = removeNilSectionsForCopy(editorPlainText(editor) || note?.data?.transcription || '');
  if (!text) return;
  try{ await navigator.clipboard.writeText(text); }catch(error){}
  try{
    await updateDoc(doc(db,note.path),{
      adminCopiedAt:serverTimestamp(),
      adminCopiedBy:ADMIN_UID
    });
  }catch(error){
    console.error(error);
  }
  copyBtn.textContent = 'Copied';
  copyBtn.classList.add('copied');
  setTimeout(() => {
    copyBtn.textContent = 'Copy note';
    copyBtn.classList.remove('copied');
  }, 1500);
});

dischargeBtn.addEventListener('click', async () => {
  const note = allNotes.find(item => item.id === selectedNoteId && item.userId === selectedUserId);
  if (!canToggleDischargeNote(note)) return;
  const selectedDateString = dateInputValue(selectedVisitDate);
  const patientName = notePatientName(note);
  const wasDischarged = Boolean(note.data?.dischargeDate);
  const message = wasDischarged
    ? `Revert discharge for ${patientName}? This IP patient will carry forward again.`
    : `Discharge ${patientName}? This IP patient will not carry forward after ${selectedDateString}.`;
  if (!confirm(message)) return;
  const previousDischargeDate = note.data?.dischargeDate || null;
  const previousDischargedBy = note.data?.dischargedBy || null;
  note.data.dischargeDate = wasDischarged ? null : selectedDateString;
  note.data.dischargedBy = wasDischarged ? null : ADMIN_UID;
  updateDischargeButton(note);
  try{
    const changes = wasDischarged
      ? {dischargeDate:null, dischargedBy:null, dischargedAt:null, updatedAt:serverTimestamp()}
      : {dischargeDate:selectedDateString, dischargedBy:ADMIN_UID, dischargedAt:serverTimestamp(), updatedAt:serverTimestamp()};
    await updateDoc(doc(db,note.path),changes);
    render();
  }catch(error){
    console.error(error);
    note.data.dischargeDate = previousDischargeDate;
    note.data.dischargedBy = previousDischargedBy;
    updateDischargeButton(note);
    alert(wasDischarged ? 'Unable to revert this discharge.' : 'Unable to discharge this IP patient.');
  }
});

printBtn.addEventListener('click', () => {
  const note = allNotes.find(item => item.id === selectedNoteId && item.userId === selectedUserId);
  const editor = document.getElementById('adminNoteEditor');
  const text = editorPlainText(editor) || note?.data?.transcription || '';
  if (!text) return;
  const printWindow = window.open('', '_blank');
  if (!printWindow){
    window.print();
    return;
  }
  printWindow.document.write(`<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WOYZ Notes Print</title>
<style>
  @page{ margin:8mm; }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    color:#111;
    font-family:Arial, Helvetica, sans-serif;
    font-size:12pt;
    line-height:1.35;
  }
  .note{
    width:100%;
    max-width:none;
    min-height:100vh;
    padding:8mm 9mm;
    white-space:pre-wrap;
  }
  h1{
    margin:0 0 10px;
    font-size:18pt;
    line-height:1.15;
  }
  strong{ font-weight:700; }
  @media print{
    body{ print-color-adjust:exact; -webkit-print-color-adjust:exact; }
  }
</style>
</head>
<body><main class="note">${richNoteHtml(text)}</main></body>
</html>`);
  printWindow.document.close();
  printWindow.focus();
  setTimeout(() => {
    printWindow.print();
    printWindow.close();
  }, 150);
});

saveNoteBtn.addEventListener('click', async () => {
  const note = allNotes.find(item => item.id === selectedNoteId && item.userId === selectedUserId);
  const editor = document.getElementById('adminNoteEditor');
  if (!note || !editor) return;
  saveNoteBtn.disabled = true;
  saveNoteBtn.textContent = 'Saving...';
  try{
    await updateDoc(doc(db,note.path),{
      transcription:editorPlainText(editor),
      adminEditedAt:serverTimestamp(),
      adminEditedBy:ADMIN_UID
    });
    saveNoteBtn.textContent = 'Saved';
    saveNoteBtn.classList.add('copied');
    setTimeout(() => {
      saveNoteBtn.textContent = 'Save';
      saveNoteBtn.classList.remove('copied');
      saveNoteBtn.disabled = false;
    }, 1200);
  }catch(error){
    console.error(error);
    saveNoteBtn.textContent = 'Try again';
    saveNoteBtn.disabled = false;
  }
});

adminSettingsBtn.addEventListener('click', event => {
  event.stopPropagation();
  const isOpen = adminSettingsMenu.classList.toggle('open');
  adminSettingsBtn.setAttribute('aria-expanded', String(isOpen));
});

document.addEventListener('click', event => {
  if (!adminSettingsMenu.contains(event.target) && event.target !== adminSettingsBtn){
    closeAdminSettings();
  }
});

mappingBtn.addEventListener('click', openMapping);
mappingCloseBtn.addEventListener('click', closeMapping);
mappingModal.addEventListener('click', event => {
  if (event.target === mappingModal) closeMapping();
});

saveMappingBtn.addEventListener('click', async () => {
  const selectedUids = Array.from(mappingUserList.querySelectorAll('input[type="checkbox"]:checked')).map(input => input.value);
  if (selectedUids.length < 2){
    alert('Select at least two users for mapping.');
    return;
  }
  const name = mappingGroupName.value.trim() || selectedUids.map(uid => userProfiles[uid]?.credentialName || uid.slice(0, 6)).join(' + ');
  saveMappingBtn.disabled = true;
  saveMappingBtn.textContent = 'Saving...';
  try{
    await addDoc(collection(db,'groups'),{
      name,
      memberUids:selectedUids,
      createdAt:serverTimestamp(),
      mappingUpdatedAt:serverTimestamp(),
      mappingUpdatedBy:ADMIN_UID
    });
    mappingGroupName.value = '';
    await syncUserMappings();
    saveMappingBtn.textContent = 'Created';
    setTimeout(() => {
      saveMappingBtn.textContent = 'Create group';
      saveMappingBtn.disabled = false;
    }, 900);
  }catch(error){
    console.error(error);
    saveMappingBtn.textContent = 'Try again';
    saveMappingBtn.disabled = false;
  }
});

mappingGroupsList.addEventListener('click', async event => {
  const button = event.target.closest('[data-delete-group]');
  if (!button) return;
  const groupId = button.dataset.deleteGroup;
  const group = allGroups.find(item => item.id === groupId);
  if (!confirm(`Remove mapping ${group?.name || 'group'}?`)) return;
  button.disabled = true;
  try{
    await deleteDoc(doc(db,'groups',groupId));
    await syncUserMappings();
  }catch(error){
    console.error(error);
    button.disabled = false;
  }
});

signoutBtn.addEventListener('click', () => signOut(auth));

      if (refreshingForUpdate) return;
      refreshingForUpdate = true;
      window.location.reload();
    });
    navigator.serviceWorker.register('./sw.js?v=70', {updateViaCache:'none'}).then(registration => {
      registration.update();
    }).catch(error => {
      console.warn('Service worker registration failed:', error);
    });
  });
}
